# Tag a version (git tag v1.2.0 && git push --tags) → tests run, the Android APK is built and signed,
# and a GitHub Release is created with the APK attached. The app's Updates page and the Android
# page then pick it up (releases/latest).
#
# Repository secrets needed for signing (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_B64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK step is skipped and the release carries the source only.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Dubai # some tests pin local-time expectations to the default config time zone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -q && sudo apt-get install -y -q rsync p7zip-full ffmpeg restic
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  apk:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # The ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle downloads what else it needs.
      - name: Signing config (unsigned build when the secrets are missing)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KS" ] || { echo "no ANDROID_KEYSTORE_B64 secret: building unsigned"; exit 0; }
          echo "$KS" | base64 -d > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=$PWD/android/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -q
      - name: Collect
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" MinisManager.apk
          sha256sum MinisManager.apk > MinisManager.apk.sha256
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: "MinisManager.apk*" }

  release:
    needs: [test, apk]
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.apk.result == 'success' }}
        with: { name: apk, path: . }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MinisManager.apk
            MinisManager.apk.sha256
