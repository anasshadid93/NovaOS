<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="0.55" stop-color="#2f6fe4"/>
      <stop offset="1" stop-color="#1a3a7c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9ffd2"/>
      <stop offset="0.45" stop-color="#3ee07a"/>
      <stop offset="1" stop-color="#16a34a"/>
    </radialGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1f4d" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="236" fill="url(#gloss)"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
  <!-- M as a rising/falling pulse -->
  <path d="M138 352V178l118 134 118-134v174" fill="none" stroke="url(#m)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- device base -->
  <rect x="150" y="396" width="212" height="18" rx="9" fill="#ffffff" opacity="0.55"/>
  <!-- status LED -->
  <circle cx="392" cy="126" r="30" fill="#3ee07a" opacity="0.55" filter="url(#glow)"/>
  <circle cx="392" cy="126" r="21" fill="url(#led)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5"/>
  </g>
</svg>
